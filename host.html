<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roofline: List your space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f6;--surf:#fff;--ink:#14213d;--mute:#5b6783;--line:#d8deea;--acc:#3b4fe0;--acc-ink:#fff;--ok:#16996a;--okbg:#dcf5ea;--off:#e6e9f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--surf:#182038;--ink:#eef1fa;--mute:#9aa6c4;--line:#2b3556;--acc:#7d8cff;--acc-ink:#0f1526;--ok:#4fd6a0;--okbg:#14382e;--off:#222c49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1526;--surf:#182038;--ink:#eef1fa;--mute:#9aa6c4;--line:#2b3556;--acc:#7d8cff;--acc-ink:#0f1526;--ok:#4fd6a0;--okbg:#14382e;--off:#222c49;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--surf)}
.brand{font-size:24px;font-weight:800}.brand i{font-style:normal;color:var(--acc)}
.who{color:var(--mute);font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.st{flex:1;min-width:110px;padding:10px 12px;border-radius:10px;background:var(--off);color:var(--mute);font-size:14px;font-weight:600}
.st.on{background:var(--acc);color:var(--acc-ink)}.st.ok{background:var(--okbg);color:var(--ok)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:30px;font-weight:800;margin-bottom:4px}.sub{color:var(--mute);margin:0 0 22px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop.hot{border-color:var(--acc)}.drop b{display:block;font-size:17px}.drop span{color:var(--mute);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.th{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--off)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .tag{position:absolute;left:8px;top:8px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.th button{position:absolute;right:6px;top:6px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.btn{padding:12px 22px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.sm{padding:7px 12px;font-size:14px}
.nav{display:flex;justify-content:space-between;margin-top:26px}
.rate{display:flex;align-items:baseline;gap:6px;font-family:"Bricolage Grotesque",sans-serif;font-size:56px;font-weight:800}
.rate small{font-size:18px;color:var(--mute);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.est div{background:var(--bg);border-radius:12px;padding:14px}.est b{display:block;font-size:22px;font-family:"Bricolage Grotesque",sans-serif}.est span{font-size:13px;color:var(--mute)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-h b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:13px;color:var(--mute);font-weight:600}
.day{aspect-ratio:1.25;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.day.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.day:disabled{opacity:.35;cursor:default}
.legend{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:20px}
.card .ph{aspect-ratio:4/3;background:var(--off)}.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:16px}.card h2{font-size:20px}.card p{margin:2px 0;color:var(--mute);font-size:14px}
.card .pr{font-weight:600;margin-top:10px;font-size:17px}.pv{font-size:13px;color:var(--mute);padding:0 4px 8px;font-weight:600}
.done{text-align:center;padding:30px 10px}.done .ck{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.card{position:static}header{padding:14px 18px}}
</style>
</head>
<body>
<header><div class="brand">Roof<i>line</i></div><div class="who">Host dashboard</div></header>
<div class="wrap">
  <main>
    <div class="steps" id="steps"></div>
    <div class="panel" id="panel"></div>
  </main>
  <aside><div class="pv">Live preview: how guests will see it</div><div class="card" id="card"></div></aside>
</div>
<script>
var AM=["Skyline view","Seating","Heating","Bar setup","Wi-Fi","Restroom access"],LOC=["Hoboken, NJ","Jersey City, NJ","Manhattan, NY","Brooklyn, NY"],NAMES=["Details","Photos","Pricing","Availability"];
var S={step:0,title:"Sunset Skyline Rooftop",loc:LOC[0],cap:20,am:["Skyline view","Seating"],photos:[],rate:85,min:2,days:{},from:"10:00",to:"23:00",m:new Date(),done:false};
S.m=new Date(S.m.getFullYear(),S.m.getMonth(),1);
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sample(i){var p=[["#ff9a62","#5a3d8a","#1b1f4b"],["#ffd08a","#e0607e","#2c2a6b"],["#8ec5ff","#6a7be0","#232a6e"]][i%3],b="";
for(var k=0;k<14;k++){var h=40+((k*37+i*23)%90),x=k*30;b+='<rect x="'+x+'" y="'+(300-h)+'" width="26" height="'+h+'" fill="#0e1330" opacity=".92"/>'}
var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p[2]+'"/><stop offset=".6" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[0]+'"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><circle cx="'+(90+i*110)+'" cy="190" r="30" fill="'+p[0]+'" opacity=".9"/>'+b+'<rect y="262" width="400" height="38" fill="#2a2f55"/><rect x="40" y="248" width="120" height="6" rx="3" fill="#cfd5ef" opacity=".7"/></svg>';
return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function steps(){$("steps").innerHTML=NAMES.map(function(n,i){return '<div class="st '+(S.done||i<S.step?"ok":i==S.step?"on":"")+'">'+(S.done||i<S.step?"\u2713 ":(i+1)+". ")+n+'</div>'}).join("")}
function nav(last){return '<div class="nav"><button class="btn" '+(S.step?'':'style="visibility:hidden" ')+'onclick="go(-1)">Back</button><button class="btn pri" onclick="go(1)">'+(last?"Publish listing":"Continue")+'</button></div>'}
function go(d){if(d>0&&S.step==3){S.done=true}else S.step+=d;draw()}
function openDays(){return Object.keys(S.days).length}
function card(){var ph=S.photos[0];$("card").innerHTML='<div class="ph">'+(ph?'<img alt="" src="'+ph+'">':'')+'</div><div class="bd"><h2>'+esc(S.title||"Untitled space")+'</h2><p>'+esc(S.loc)+' \u00b7 up to '+S.cap+' guests</p><p>'+esc(S.am.join(", ")||"No amenities yet")+'</p><div class="pr">$'+S.rate+' / hour <span style="font-weight:400;color:var(--mute);font-size:14px">\u00b7 '+S.min+' hr minimum</span></div><p>'+(openDays()?openDays()+' days open, '+S.from+"\u2013"+S.to:"Availability not set")+'</p></div>'}
function photoGrid(){$("thumbs").innerHTML=S.photos.map(function(p,i){return '<div class="th"><img alt="Photo '+(i+1)+'" src="'+p+'">'+(i?'':'<span class="tag">Cover</span>')+'<button aria-label="Remove photo" onclick="rm('+i+')">\u00d7</button></div>'}).join("");card()}
function rm(i){S.photos.splice(i,1);photoGrid()}
function addFiles(fs){Array.prototype.slice.call(fs).filter(function(f){return /^image\//.test(f.type)}).forEach(function(f){var r=new FileReader();r.onload=function(){S.photos.push(r.result);photoGrid()};r.readAsDataURL(f)})}
function sampleAdd(){for(var i=0;i<3;i++)S.photos.push(sample(S.photos.length));photoGrid()}
function est(){var r=S.rate,m=S.min;$("rv").textContent=r;$("e1").textContent="$"+(r*4);$("e2").textContent="$"+(r*m);$("e3").textContent="$"+(r*4*8)}
function cal(){var y=S.m.getFullYear(),mo=S.m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),t=new Date();t.setHours(0,0,0,0);
var h='<div class="cal-h"><button class="btn sm" onclick="mon(-1)" aria-label="Previous month">\u2039</button><b>'+S.m.toLocaleString("en-US",{month:"long",year:"numeric"})+'</b><button class="btn sm" onclick="mon(1)" aria-label="Next month">\u203a</button></div><div class="grid">';
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(d){h+='<div class="dow">'+d+'</div>'});
for(var i=0;i<first;i++)h+='<div></div>';
for(var d=1;d<=n;d++){var k=y+"-"+(mo+1)+"-"+d,past=new Date(y,mo,d)<t;h+='<button class="day'+(S.days[k]?" on":"")+'" '+(past?"disabled":"")+' onclick="tog(\''+k+'\')">'+d+'</button>'}
$("cal").innerHTML=h+'</div>';$("cnt").textContent=openDays()+" days open";card()}
function mon(d){S.m=new Date(S.m.getFullYear(),S.m.getMonth()+d,1);cal()}
function tog(k){if(S.days[k])delete S.days[k];else S.days[k]=1;cal()}
function quick(w){var y=S.m.getFullYear(),mo=S.m.getMonth(),n=new Date(y,mo+1,0).getDate(),t=new Date();t.setHours(0,0,0,0);
for(var d=1;d<=n;d++){var dt=new Date(y,mo,d),k=y+"-"+(mo+1)+"-"+d,we=dt.getDay()==0||dt.getDay()==6;if(dt<t)continue;if(w=="clear")delete S.days[k];else if((w=="we")==we)S.days[k]=1}cal()}
function draw(){steps();var p=$("panel"),h="";
if(S.done){p.innerHTML='<div class="done"><div class="ck">\u2713</div><h1>Your listing is live</h1><p class="sub">'+esc(S.title)+' is now visible to guests in '+esc(S.loc)+'. You\u2019ll get a notification for every booking request.</p><button class="btn" onclick="S.done=false;S.step=0;draw()">Edit listing</button></div>';card();return}
if(S.step==0){h='<h1>Tell us about your space</h1><p class="sub">Guests see this first, so keep it clear and specific.</p><label for="t">Listing title</label><input type="text" id="t" maxlength="60"><div class="row"><div><label for="l">Location</label><select id="l">'+LOC.map(function(x){return '<option'+(x==S.loc?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div><div><label for="c">Max guests</label><input type="number" id="c" min="1" max="200"></div></div><label>Amenities</label><div class="chips">'+AM.map(function(a){return '<button class="chip'+(S.am.indexOf(a)>-1?" on":"")+'" onclick="chip(this,\''+a+'\')">'+a+'</button>'}).join("")+'</div>'+nav()}
if(S.step==1){h='<h1>Add photos</h1><p class="sub">Bright photos taken at golden hour get the most views. The first photo is your cover.</p><div class="drop" id="dz" tabindex="0"><b>Drag photos here or click to upload</b><span>JPG or PNG, up to 10 photos</span></div><input type="file" id="f" accept="image/*" multiple hidden><div style="margin-top:12px"><button class="btn sm" onclick="sampleAdd()">Use sample photos</button></div><div class="thumbs" id="thumbs"></div>'+nav()}
if(S.step==2){h='<h1>Set your hourly rate</h1><p class="sub">You can change this any time. Spaces with a view in Hoboken and NYC often list between $50 and $150 an hour.</p><div class="rate">$<span id="rv"></span><small>per hour</small></div><input type="range" id="r" min="20" max="300" step="5" aria-label="Hourly rate"><label for="m">Minimum booking</label><select id="m">'+[1,2,3,4].map(function(x){return '<option value="'+x+'"'+(x==S.min?" selected":"")+'>'+x+' hour'+(x>1?"s":"")+'</option>'}).join("")+'</select><div class="est"><div><b id="e1"></b><span>4-hour booking</span></div><div><b id="e2"></b><span>Minimum booking</span></div><div><b id="e3"></b><span>8 bookings a month</span></div></div>'+nav()}
if(S.step==3){h='<h1>Set your availability</h1><p class="sub">Tap the days your space is open. Guests can only book the hours you set.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn sm" onclick="quick(\'we\')">Weekends</button><button class="btn sm" onclick="quick(\'wd\')">Weekdays</button><button class="btn sm" onclick="quick(\'clear\')">Clear month</button></div><div id="cal"></div><div class="legend"><span style="color:var(--ok);font-weight:600" id="cnt"></span><span>Open hours:</span><select id="a" style="width:auto"></select><span>to</span><select id="b" style="width:auto"></select></div>'+nav(1)}
p.innerHTML=h;bind();card()}
function chip(el,a){var i=S.am.indexOf(a);if(i>-1)S.am.splice(i,1);else S.am.push(a);el.classList.toggle("on");card()}
function bind(){var g=$;
if(S.step==0){g("t").value=S.title;g("c").value=S.cap;g("t").oninput=function(e){S.title=e.target.value;card()};g("l").onchange=function(e){S.loc=e.target.value;card()};g("c").oninput=function(e){S.cap=Math.max(1,+e.target.value||1);card()}}
if(S.step==1){var dz=g("dz"),f=g("f");dz.onclick=function(){f.click()};dz.onkeydown=function(e){if(e.key=="Enter")f.click()};f.onchange=function(){addFiles(f.files)};
dz.ondragover=function(e){e.preventDefault();dz.classList.add("hot")};dz.ondragleave=function(){dz.classList.remove("hot")};dz.ondrop=function(e){e.preventDefault();dz.classList.remove("hot");addFiles(e.dataTransfer.files)};photoGrid()}
if(S.step==2){g("r").value=S.rate;g("r").oninput=function(e){S.rate=+e.target.value;est();card()};g("m").onchange=function(e){S.min=+e.target.value;est();card()};est()}
if(S.step==3){var o="";for(var h=6;h<=24;h++){var v=(h<10?"0":"")+h+":00";o+='<option>'+(h==24?"24:00":v)+'</option>'}g("a").innerHTML=o;g("b").innerHTML=o;g("a").value=S.from;g("b").value=S.to;g("a").onchange=function(e){S.from=e.target.value;card()};g("b").onchange=function(e){S.to=e.target.value;card()};cal()}}
draw();
</script>
</body>
</html>
