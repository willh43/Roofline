<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roofline: Prototype</title>
<style>
:root{--bg:#eef1f6;--surf:#fff;--ink:#14213d;--mute:#5b6783;--line:#d8deea;--acc:#3b4fe0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1526;--surf:#182038;--ink:#eef1fa;--mute:#9aa6c4;--line:#2b3556;--acc:#7d8cff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px}
main{max-width:640px;width:100%}h1{font-size:42px;margin:0 0 6px;letter-spacing:-.02em}h1 i{font-style:normal;color:var(--acc)}
p{color:var(--mute);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px;color:inherit;text-decoration:none}
a:hover{border-color:var(--acc)}a b{display:block;font-size:20px;margin-bottom:4px}a span{color:var(--mute);font-size:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Roof<i>line</i></h1>
<p>Rent rooftops and scenic spaces by the hour in Hoboken and NYC. Interactive prototype for our group project.</p>
<div class="grid">
<a href="host.html"><b>Host flow</b><span>List a space: details, photos, pricing, availability</span></a>
<a href="guest.html"><b>Guest flow</b><span>Search, pick a time, and book a space</span></a>
</div>
</main>
</body>
</html>
